# Tier 0/1 locations, shared via `include` between the plain :80 listener
# and the TLS-only (no mTLS) :8444 listener in default.conf, so a future fix
# to one (e.g. the order-status.json 404 below, or the X-Forwarded-For
# hardening) can't silently apply to only one of the two listeners. Never
# included on the mTLS :443 listener.

# Reverse-proxies to verify's own public Tier 1 API. verify has no
# published port of its own (see docker-compose.yml) specifically so
# that /tier2/check can trust nginx-set headers as proof of an mTLS
# handshake nginx itself terminated — these two locations are what keep
# Tier 1's challenge/verify endpoints reachable from outside despite
# that, at http://localhost:8080/tier1/... instead of :8001 directly.
# `=` (exact match, not prefix): the isolation of verify's internal-only
# /tier1/admin-config endpoint (see verify/main.py) depends on these NOT
# matching any path beyond the literal ones below -- a plain prefix
# location would also match any future verify route merely starting
# with "challenge"/"verify" under /tier1/, silently exposing it.
location = /tier1/challenge {
    proxy_pass http://verify:8001/tier1/challenge;
    proxy_set_header Content-Type $content_type;
    # Without this, verify sees every external caller as nginx's own
    # container IP (request.client.host), collapsing the per-client
    # rate limit into one shared bucket for everyone. Set directly to
    # $remote_addr (not $proxy_add_x_forwarded_for) so this is always
    # nginx's own view of the direct TCP peer, never something a client
    # can override by sending its own X-Forwarded-For.
    proxy_set_header X-Forwarded-For $remote_addr;
}

location = /tier1/verify {
    proxy_pass http://verify:8001/tier1/verify;
    proxy_set_header Content-Type $content_type;
    proxy_set_header X-Forwarded-For $remote_addr;
}

location = /catalog/contact.json {
    auth_request /tier1-auth;
    # verify's /tier1/check response carries the caller's proven domain in
    # X-Verified-Domain (see verify/main.py) -- previously computed and
    # then discarded: auth_request's own subrequest response headers are
    # not forwarded to the client or logged unless explicitly captured.
    # auth_request_set pulls it into a variable the access_log format
    # below (catalog_activity, see default.conf/default.prod.conf) can
    # record, so the identity Tier 1 just proved is actually visible
    # somewhere -- the admin UI's existing catalog-activity view -- instead
    # of being proven and then going nowhere.
    auth_request_set $verified_domain $upstream_http_x_verified_domain;
    default_type application/json;
    alias /usr/share/nginx/html/catalog/contact.json;
}

# Internal-only subrequest target — never reachable directly from
# outside. Forwards the client's Authorization header to the verify
# service and relies on nginx mapping the subrequest's 401/403 straight
# back to the client (auth_request's default behavior).
#
# error_page here maps subrequest failures (verify unreachable/erroring)
# to a clean 401 instead of a 500. Access was already denied either way
# (auth_request treats any non-2xx/401/403 subrequest response as an
# error and 500s the outer request) — this is a fail-closed status-code
# fix, not a security fix.
location = /tier1-auth {
    internal;
    proxy_pass http://verify:8001/tier1/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    error_page 500 502 503 504 = @tier1_unavailable;
}

location @tier1_unavailable {
    internal;
    return 401;
}

# order-status.json is a Tier 2 resource -- gated on the mTLS :443
# listener by mTLS + a Keycloak token via /tier2-auth. Every listener
# that includes this file shares the same `root` and otherwise has no
# location for this path, so without this explicit deny it would
# silently fall through to `location /`'s catch-all `try_files` and be
# served in full, completely unauthenticated.
location = /catalog/order-status.json {
    return 404;
}

location / {
    try_files $uri $uri/ =404;
}
