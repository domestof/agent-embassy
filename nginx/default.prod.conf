# Production's nginx config -- mounted by docker-compose.prod.yml in place
# of nginx/default.conf (dev), at the same container path. Shares the exact
# same :8444/:443 server blocks (tls-listeners.conf) with dev; only :80
# differs.
#
# dev's :80 serves Tier 0/1 in plain HTTP because dev is never
# internet-facing (only ever reached at localhost). docker-compose.prod.yml
# maps this same port straight to the public internet ("80:80", its own
# comment: "now internet-facing") -- serving Tier 1's bearer-token-bearing
# /tier1/challenge, /tier1/verify, and /catalog/contact.json in plaintext
# there would leak session tokens to anyone on the network path. Found by
# adversarial review (2026-08-11) of the initial productionization commit,
# which added the internet-facing port mapping but never addressed this.
#
# Fix: redirect everything to the real HTTPS listener (:8444, remapped to
# the public :443 by docker-compose.prod.yml) except the ACME HTTP-01
# challenge path, which Let's Encrypt's protocol requires stay in plain
# HTTP on :80 -- certbot's webroot plugin (docker-compose.prod.yml's
# `certbot` service) writes challenge files under
# static/.well-known/acme-challenge/, already reachable via this root with
# no separate location needed (confirmed structurally: it's the same
# static/ directory this block's root already serves).

# Identical to default.conf (dev)'s own copy -- see that file's comment for
# why this is duplicated rather than factored into tls-listeners.conf.
log_format catalog_activity '$remote_addr - $remote_user [$time_local] "$request" '
                             '$status $body_bytes_sent "$http_referer" '
                             '"$http_user_agent" "$http_x_forwarded_for" '
                             'verified_domain="$verified_domain"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Internal-only plain HTTP for Tier 0/1 -- NOT in docker-compose.prod.yml's
# `ports:` override, so (like `verify:8001`/`openbao:8200` already do)
# it's reachable container-to-container over the Docker network but never
# published to the host/public internet. Exists for exactly one caller:
# admin's own "preview as an agent" console (admin/test_console.py's
# STATIC_BASE_URL, overridden to point here in this file's `admin` service
# below) -- that traffic never crosses the public internet, so the :80
# block's redirect-to-HTTPS above (which exists specifically to protect
# traffic that DOES) doesn't apply and would in fact break it: :80 in prod
# no longer serves plaintext content at all once redirecting, and the real
# public HTTPS listener (:8444 below) is TLS with a certificate whose SAN
# is the real public hostname, not the internal `static` Docker DNS name,
# so an internal caller can't use it either without disabling hostname
# verification -- a worse tradeoff than this unpublished-port isolation,
# which is the same trust boundary already used for verify/openbao. Found
# missing by adversarial review, 2026-08-12: the initial :80 redirect fix
# shipped without noticing admin's console had no other way to reach
# Tier 0/1 content in production at all.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    access_log /var/log/nginx/access.log catalog_activity;
    include /etc/nginx/tier0-tier1-locations.conf;
}

include /etc/nginx/tls-listeners.conf;
