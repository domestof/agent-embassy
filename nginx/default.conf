# Local dev's nginx config. Serves the Tier 0 public catalog directly
# (unauthenticated), and gates Tier 1 resources (currently just
# contact.json) behind the verify service's session-token check via
# nginx's auth_request module — the `contact` resource is unreachable
# without a valid Tier 1 session, whatever path is requested, because this
# is the only server block on :80 and the only place `contact.json` is
# served from.
#
# In production, docker-compose.prod.yml mounts nginx/default.prod.conf in
# place of this file — same :8444/:443 blocks (shared via tls-listeners.conf
# below), but a hardened :80 that redirects to HTTPS instead of serving
# Tier 0/1 in plaintext (see that file's header comment for why: dev's :80
# is never internet-facing, so the tradeoff this file makes is fine for dev
# only).

# Same as the base image's own "main" format (see /etc/nginx/nginx.conf),
# plus the domain Tier 1's own auth_request already proved for
# /catalog/contact.json hits (see tier0-tier1-locations.conf's
# auth_request_set) -- empty string for every other request, which is
# fine, nginx variables introduced this way are just "" when unset for a
# given request, not an error. Defined here (and identically in
# default.prod.conf) rather than in the shared tls-listeners.conf so it's
# already known by the time that file's own `include` runs below.
log_format catalog_activity '$remote_addr - $remote_user [$time_local] "$request" '
                             '$status $body_bytes_sent "$http_referer" '
                             '"$http_user_agent" "$http_x_forwarded_for" '
                             'verified_domain="$verified_domain"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    access_log /var/log/nginx/access.log catalog_activity;

    # Locations shared with the :8444 real-HTTPS listener below — see
    # nginx/tier0-tier1-locations.conf's own header comment for why this is
    # an `include` rather than copy-pasted per listener.
    include /etc/nginx/tier0-tier1-locations.conf;
}

include /etc/nginx/tls-listeners.conf;
