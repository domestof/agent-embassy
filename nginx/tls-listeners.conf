# The :8444 (Tier 0/1 real HTTPS) and :443 (Tier 2/3 mTLS) server blocks --
# identical between local dev and production, so both nginx/default.conf
# (dev) and nginx/default.prod.conf (prod) `include` this one file rather
# than each carrying their own copy. Only the plaintext :80 block actually
# differs between the two (see default.prod.conf's header comment for why),
# so this is the only shared piece worth factoring out.

# Real (non-mTLS) HTTPS for Tier 0/1, alongside the mTLS-only :443 block
# below. A separate `listen` port rather than SNI-branching :443's mTLS
# block — SNI-based per-server-block cert/verify selection is real but
# version-sensitive and harder to reason about than a dedicated port, and
# this project already uses one port per trust tier everywhere else. In
# production this is remapped to the public :443 (see
# docker-compose.prod.yml); in dev it's published directly as :8444.
# ssl_certificate here is `public.crt`/`public.key` — a copy of the dev
# self-signed cert locally (see certs/generate-dev-certs.sh), a real Let's
# Encrypt cert in production (see certs/refresh-public-cert.sh) — nginx
# itself never needs to know which. No ssl_client_certificate/
# ssl_verify_client at all: Tier 2/3 resources are NOT reachable here (the
# shared include's explicit order-status.json 404 enforces that), the same
# isolation :80 already has.
server {
    listen 8444 ssl;
    server_name _;
    root /usr/share/nginx/html;

    ssl_certificate /etc/nginx/certs/public.crt;
    ssl_certificate_key /etc/nginx/certs/public.key;

    # catalog_activity is defined by whichever of default.conf/
    # default.prod.conf is active, before this file's own `include` runs.
    access_log /var/log/nginx/access.log catalog_activity;
    include /etc/nginx/tier0-tier1-locations.conf;

    # Fronts EXACTLY the three Keycloak paths a real Tier 2 partner's OAuth
    # client needs for the client_credentials grant this design uses (the
    # discovery doc, the token endpoint, and the signing-key set a
    # conformant client library may fetch to self-validate) so a real
    # partner reaches them over the same TLS this listener already
    # terminates, instead of Keycloak self-publishing its own cert/port.
    # KC_PROXY_HEADERS=xforwarded (docker-compose.prod.yml) makes Keycloak
    # trust these headers for hostname/scheme decisions. Only on this
    # listener, never on :80 -- Keycloak's public endpoint should always be
    # reached over TLS.
    #
    # `location =` (exact match), NOT a `/keycloak/` prefix proxy to
    # Keycloak's document root -- a prefix proxy here would forward
    # EVERYTHING under /keycloak/, including /keycloak/admin/... (the full
    # admin console) and /keycloak/realms/master/... (an unauthenticated
    # password-grant login endpoint for the master realm's admin-cli
    # client, with no rate limiting anywhere in this path) straight onto a
    # port docker-compose.prod.yml remaps directly to the public :443.
    # Found live during adversarial review: a prefix proxy really did let
    # `POST /keycloak/realms/master/protocol/openid-connect/token` reach
    # Keycloak's real credential check. This is the exact same "prefix
    # match on an internal-only path silently exposes more than intended"
    # bug class the roadmap's step-6 adversarial review already found once
    # on /tier1/challenge and /tier1/verify -- same fix shape, applied here
    # from the start rather than after a second incident.
    #
    # keycloak/realm-export.json's frontendUrl is deliberately still pinned
    # to the internal http://keycloak:8080 (see docker-compose.prod.yml's
    # own comment on the keycloak service for why touching it is
    # out-of-scope risk) -- so Keycloak's own responses (this discovery doc
    # included) advertise that internal, externally-unreachable address for
    # every endpoint URL. A second round of adversarial review (2026-08-11)
    # found this makes the discovery doc actively misleading to a real
    # external OIDC client, not just "cosmetically odd": it fetches this
    # doc, reads token_endpoint/jwks_uri as http://keycloak:8080/..., and
    # has no way to reach either. The two sub_filter rewrites below patch
    # exactly those two fields to the real externally-reachable path (this
    # exact proxy) -- `issuer` is deliberately left untouched, since it must
    # keep matching the `iss` claim Keycloak actually embeds in minted
    # tokens (also driven by frontendUrl); a client_credentials-only
    # consumer never dereferences `issuer` as a URL, only string-compares
    # it, so this mismatch between issuer's internal-looking value and the
    # externally-reachable value below is intentional, not a leftover bug.
    # authorization_endpoint/userinfo_endpoint/end_session_endpoint etc
    # remain internal/unreachable and unproxied on purpose -- Tier 2's
    # design is client_credentials-only, no interactive/browser flow ever
    # needs them (see admin/keycloak_client.py's "service-accounts-only, no
    # interactive flows" partner-client shape check); proxying them would be
    # speculative surface for a flow this design doesn't support.
    #
    # DEV-ONLY caveat, found live (2026-08-12 adversarial review): nginx's
    # $host strips the port, so the rewritten URLs below omit dev's
    # nonstandard :8444 -- fetching them exactly as returned fails (TLS
    # error, since dev's default port 443 is the DIFFERENT mTLS-only
    # listener). Manually appending :8444 works correctly. Production is
    # unaffected: its real external port genuinely is the standard 443, so
    # the omission there is exactly correct, not a bug.
    location = /keycloak/realms/agent-embassy/.well-known/openid-configuration {
        proxy_pass http://keycloak:8080/realms/agent-embassy/.well-known/openid-configuration;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Keycloak must not gzip this response, or sub_filter below (which
        # operates on the plain response body nginx receives from upstream)
        # has nothing to match against.
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter 'http://keycloak:8080/realms/agent-embassy/protocol/openid-connect/token' '$scheme://$host/keycloak/realms/agent-embassy/protocol/openid-connect/token';
        sub_filter 'http://keycloak:8080/realms/agent-embassy/protocol/openid-connect/certs' '$scheme://$host/keycloak/realms/agent-embassy/protocol/openid-connect/certs';
    }
    location = /keycloak/realms/agent-embassy/protocol/openid-connect/token {
        proxy_pass http://keycloak:8080/realms/agent-embassy/protocol/openid-connect/token;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /keycloak/realms/agent-embassy/protocol/openid-connect/certs {
        proxy_pass http://keycloak:8080/realms/agent-embassy/protocol/openid-connect/certs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

# Tier 2: OAuth2 (Keycloak-issued access token) + mTLS. nginx is the only
# thing that terminates TLS and validates the client certificate against
# ./certs/ca.crt (`ssl_verify_client on` rejects the TLS handshake itself,
# before any location matches, if the client doesn't present a cert signed
# by that CA) — verify's /tier2/check trusts the X-SSL-Client-Verify header
# below specifically because verify is unreachable except through this
# listener (see docker-compose.yml). The access token proves authorization
# (scope); the client certificate proves this specific channel. Dev certs
# only — see certs/generate-dev-certs.sh; never deploy that CA for real.
server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client on;
    # nginx does not re-verify the client certificate on a resumed TLS
    # session — confirmed live during adversarial review: a second
    # connection presenting only a saved session ticket (no certificate at
    # all) still reached the protected resource. Disabling resumption
    # forces a full handshake, and therefore a real certificate check, on
    # every connection. This listener's traffic volume (bilateral partner
    # API calls) makes the extra handshake cost a non-issue.
    ssl_session_tickets off;
    ssl_session_cache off;

    location = /catalog/order-status.json {
        auth_request /tier2-auth;
        default_type application/json;
        alias /usr/share/nginx/html/catalog/order-status.json;
    }

    location = /tier2-auth {
        internal;
        proxy_pass http://verify:8001/tier2/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        error_page 500 502 503 504 = @tier2_unavailable;
    }

    location @tier2_unavailable {
        internal;
        return 401;
    }

    # Tier 3's mock order-placement endpoint (see verify/main.py). Unlike
    # order-status.json above, this is a real proxied POST with a body and
    # side effects, not a static file gated by auth_request — so it's
    # proxy_pass'd straight to verify, which does its own mTLS + Keycloak
    # token-introspection checks (see /tier3/orders' docstring) rather than
    # nginx pre-checking via a separate internal auth_request location.
    #
    # This is also the FIRST location in this file that forwards
    # X-SSL-Client-Verify to something a client can address directly:
    # /tier2-auth above is `internal;` (structurally unreachable by a
    # client), so there the header is only ever informative. Here, nginx's
    # proxy_set_header OVERWRITE (not append — nginx always replaces
    # whatever a client sent for this header) is what keeps it unforgeable
    # despite /tier3/orders being client-addressable. Only on the :443
    # block, never on :80 — see nginx also 404s /tier3/orders on the plain
    # listener (its `location /` returns 404, unmatched).
    location = /tier3/orders {
        proxy_pass http://verify:8001/tier3/orders;
        proxy_set_header Content-Type $content_type;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
    }

    # The per-action status poll (GET /tier3/orders/{action_id} -- the 202
    # response's status_path). Deliberately `^~ /tier3/orders/` WITH the
    # trailing slash, alongside the exact match above: nginx decodes and
    # normalizes dot-segments BEFORE location matching, so
    # /tier3/orders/../tier1/admin-config normalizes to a path this prefix
    # no longer matches -- it cannot be used to reach verify's internal-only
    # admin endpoints. The prefix-match bug class this repo has hit twice
    # (step 6: /tier1/*, step 9: /keycloak/) was a prefix match exposing
    # UNINTENDED upstream paths; here the prefix's entire subtree maps to
    # exactly one verify route family (the poll), which is intended to be
    # public on this listener. proxy_pass carries NO URI part, so the
    # normalized path is forwarded verbatim. Same three headers as above --
    # X-Forwarded-For is what keys the poll's own rate bucket (without it
    # every caller would share nginx's IP, the step-6 bug).
    location ^~ /tier3/orders/ {
        proxy_pass http://verify:8001;
        proxy_set_header Content-Type $content_type;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
    }

    location / {
        return 404;
    }
}
